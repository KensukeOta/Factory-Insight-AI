[project]
name = "factory-insight-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "KensukeOta", email = "bump_kensuke_miwa@yahoo.ne.jp" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "jupyter>=1.1.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "shap==0.53.0rc0",
]

[project.scripts]
factory-insight-ai = "factory_insight_ai:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
