services:
  db:
    image: postgres:17
    container_name: factory-insight-db
    environment:
      POSTGRES_USER: factory_user
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: factory_insight_ai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U factory_user -d factory_insight_ai
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
